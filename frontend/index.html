<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Converter | MP3 + MP4</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="converter">
      <p class="eyebrow">LOCAL MEDIA TOOL</p>
      <h1>YouTube Converter</h1>
      <p class="intro">Bring a video link. Take the audio or video file.</p>

      <form id="lookup-form">
        <label class="field-label" for="urlInput">YouTube video URL</label>
        <input
          type="url"
          id="urlInput"
          placeholder="https://www.youtube.com/watch?v=..."
          autocomplete="url"
          required
        />
        <button id="infoBtn" type="submit">Get video details</button>
      </form>

      <section id="information" aria-live="polite" hidden>
        <img id="info-img" alt="Video thumbnail" />
        <div class="info-det">
          <p id="title"><span>Title</span><strong></strong></p>
          <p id="duration"><span>Duration</span><strong></strong></p>
          <p id="uploader"><span>Uploader</span><strong></strong></p>
        </div>
      </section>

      <section id="download-info" aria-label="Download options" hidden>
        <div id="format-box">
          <label class="field-label" for="media-format">File format</label>
          <select id="media-format" name="media-format">
            <option value="mp3">MP3 audio</option>
            <option value="mp4">MP4 video</option>
          </select>
        </div>
        <button id="download-btn" type="button">Download file</button>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <footer>Download Content only if you have the permission to download.</footer>
    <script src="script.js"></script>
  </body>
</html>
